spring.application.name=ue6dejunio-api
spring.config.import=optional:file:./.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === DATASOURCE ===
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ue_6_de_junio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# === JPA ===
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# === SERVER ===
server.port=${SERVER_PORT:8090}
server.error.include-message=always
server.error.include-binding-errors=always
spring.threads.virtual.enabled=true

# === JWT (RS256) ===
app.security.jwt.public-key=classpath:keys/public.pem
app.security.jwt.private-key=classpath:keys/private.pem
app.security.jwt.issuer=ue6dejunio-api
app.security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.security.jwt.reset-token-ttl-minutes=${JWT_RESET_TTL_MINUTES:20}

# === CORS ===
app.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:5300}

# === BCrypt ===
app.security.bcrypt.strength=12

# === Rate limiting ===
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.security.rate-limit.login.refill-per-minute=${RATE_LIMIT_LOGIN_REFILL:5}
app.security.rate-limit.global.capacity=${RATE_LIMIT_GLOBAL_CAPACITY:100}
app.security.rate-limit.global.refill-per-minute=${RATE_LIMIT_GLOBAL_REFILL:100}
app.security.rate-limit.change-password.capacity=${RATE_LIMIT_CHANGE_PASSWORD_CAPACITY:5}
app.security.rate-limit.change-password.refill-per-minute=${RATE_LIMIT_CHANGE_PASSWORD_REFILL:5}
app.security.rate-limit.forgot-password.capacity=${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:5}
app.security.rate-limit.forgot-password.refill-per-minute=${RATE_LIMIT_FORGOT_PASSWORD_REFILL:5}
app.security.rate-limit.reset-password.capacity=${RATE_LIMIT_RESET_PASSWORD_CAPACITY:5}
app.security.rate-limit.reset-password.refill-per-minute=${RATE_LIMIT_RESET_PASSWORD_REFILL:5}
app.security.rate-limit.ip-resolver=${RATE_LIMIT_IP_RESOLVER:direct}
app.security.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# === OpenAPI ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# === Logging ===
logging.level.org.springframework.security=INFO
logging.level.bo.edu.univalle.sis.ue6dejunio_api=INFO

# === Pagination ===
spring.data.web.pageable.one-indexed-parameters=true

# === MAIL (Gmail SMTP) ===
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# === APP MAIL ===
app.mail.from=${MAIL_FROM:no-reply@ue6dejunio.bo}
app.mail.from-name=${MAIL_FROM_NAME:Unidad Educativa 6 de Junio}

# === Frontend ===
app.frontend.reset-url=${FRONTEND_RESET_URL:http://localhost:5173/reset-password}

# === BOOTSTRAP DIRECTOR ===
# The account that has to exist before anybody can log in. Deliberately without fallbacks: these
# are one real person's e-mail, password and identity card, and a default here would be a working
# account whose credentials are readable in the repository. Unset, no account is created.
app.bootstrap.director.email=${BOOTSTRAP_DIRECTOR_EMAIL:}
app.bootstrap.director.password=${BOOTSTRAP_DIRECTOR_PASSWORD:}
app.bootstrap.director.ci=${BOOTSTRAP_DIRECTOR_CI:}
app.bootstrap.director.names=${BOOTSTRAP_DIRECTOR_NAMES:}
app.bootstrap.director.last-names=${BOOTSTRAP_DIRECTOR_LAST_NAMES:}

# === INSTITUTION ===
# The heading every official document prints. The Director is not here: they are a user who holds
# the role, and the role changes hands while none of these do. The libreta and the informe
# pedagogico print all of them, and none varies by course, student or year.
app.institution.district=${INSTITUTION_DISTRICT:Sacaba}
app.institution.school=${INSTITUTION_SCHOOL:Unidad Educativa "6 de Junio"}
app.institution.department=${INSTITUTION_DEPARTMENT:Cochabamba}
app.institution.dependency=${INSTITUTION_DEPENDENCY:Fiscal}
app.institution.shift=${INSTITUTION_SHIFT:Mañana}
app.institution.education-level=${INSTITUTION_EDUCATION_LEVEL:Educación Primaria Comunitaria Vocacional}

# === AI PREDICTION (FastAPI) ===
app.prediction.url=${PREDICTION_URL:http://127.0.0.1:8001}
app.prediction.token=${PREDICTION_TOKEN:}
# Connecting is immediate or it never happens: the model listens on loopback. Answering is not —
# the first call of the day loads TensorFlow before it predicts anything, and a tight read timeout
# would make the panel look broken every morning. Without both, the Java client waits forever.
app.prediction.connect-timeout=${PREDICTION_CONNECT_TIMEOUT:5s}
app.prediction.read-timeout=${PREDICTION_READ_TIMEOUT:60s}

# === AUTOMATIC RISK SWEEP (RF 30) ===
# A mark or a roll call does not call the model. It leaves a row in `risk_prediction_queue`, and
# this sweep spends the queue: thirty grades entered one after another in the same subject collapse
# into a single prediction run.
app.risk.sweep.enabled=${RISK_SWEEP_ENABLED:true}
# How long after one sweep ends the next begins — the delay a teacher waits between saving a grade
# and seeing the risk panel move. ISO-8601: PT30S, PT1M, PT5M, PT15M.
app.risk.sweep.interval=${RISK_SWEEP_INTERVAL:PT5M}
# Not the same as the interval: the model loads TensorFlow on its first call, so a sweep firing
# while this application is still starting waits on a service that has not finished starting either.
app.risk.sweep.initial-delay=${RISK_SWEEP_INITIAL_DELAY:PT1M}
# The most subjects one tick will take. What it leaves behind the next tick takes, oldest first.
app.risk.sweep.batch-size=${RISK_SWEEP_BATCH_SIZE:200}
