spring.application.name=ue6dejunio-api
spring.config.import=optional:file:./.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === DATASOURCE ===
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ue_6_de_junio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# === JPA ===
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# === SERVER ===
server.port=${SERVER_PORT:8090}
server.error.include-message=always
server.error.include-binding-errors=always
spring.threads.virtual.enabled=true

# === JWT (RS256) ===
app.security.jwt.public-key=classpath:keys/public.pem
app.security.jwt.private-key=classpath:keys/private.pem
app.security.jwt.issuer=ue6dejunio-api
app.security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.security.jwt.reset-token-ttl-minutes=${JWT_RESET_TTL_MINUTES:20}

# === CORS ===
app.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:5300}

# === BCrypt ===
app.security.bcrypt.strength=12

# === Rate limiting ===
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.security.rate-limit.login.refill-per-minute=${RATE_LIMIT_LOGIN_REFILL:5}
app.security.rate-limit.global.capacity=${RATE_LIMIT_GLOBAL_CAPACITY:100}
app.security.rate-limit.global.refill-per-minute=${RATE_LIMIT_GLOBAL_REFILL:100}
app.security.rate-limit.change-password.capacity=${RATE_LIMIT_CHANGE_PASSWORD_CAPACITY:5}
app.security.rate-limit.change-password.refill-per-minute=${RATE_LIMIT_CHANGE_PASSWORD_REFILL:5}
app.security.rate-limit.forgot-password.capacity=${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:5}
app.security.rate-limit.forgot-password.refill-per-minute=${RATE_LIMIT_FORGOT_PASSWORD_REFILL:5}
app.security.rate-limit.reset-password.capacity=${RATE_LIMIT_RESET_PASSWORD_CAPACITY:5}
app.security.rate-limit.reset-password.refill-per-minute=${RATE_LIMIT_RESET_PASSWORD_REFILL:5}
app.security.rate-limit.ip-resolver=${RATE_LIMIT_IP_RESOLVER:direct}
app.security.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# === OpenAPI ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# === Logging ===
logging.level.org.springframework.security=INFO
logging.level.bo.edu.univalle.sis.ue6dejunio_api=INFO

# === Pagination ===
spring.data.web.pageable.one-indexed-parameters=true

# === MAIL (Gmail SMTP) ===
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# === APP MAIL ===
app.mail.from=${MAIL_FROM:no-reply@ue6dejunio.bo}
app.mail.from-name=${MAIL_FROM_NAME:Unidad Educativa 6 de Junio}

# === Frontend ===
app.frontend.reset-url=${FRONTEND_RESET_URL:http://localhost:5173/reset-password}

# === INSTITUTION ===
# The heading every official document prints. The Director is not here: they are a user who holds
# the role, and the role changes hands while these two do not.
app.institution.district=${INSTITUTION_DISTRICT:Sacaba}
app.institution.school=${INSTITUTION_SCHOOL:Unidad Educativa "6 de Junio"}
