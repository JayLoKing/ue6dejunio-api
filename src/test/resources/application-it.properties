spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-it.sql
spring.jpa.defer-datasource-initialization=false

app.security.jwt.public-key=classpath:keys/public.pem
app.security.jwt.private-key=classpath:keys/private.pem
app.security.jwt.issuer=ue6dejunio-api-it
app.security.jwt.access-token-ttl-minutes=15
app.security.cors.allowed-origins=http://localhost:5173
app.security.bcrypt.strength=4

app.mail.from=it@test.bo
app.mail.from-name=IT Test
spring.mail.host=localhost
spring.mail.port=3025
