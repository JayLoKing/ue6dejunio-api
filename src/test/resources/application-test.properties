
spring.datasource.url=jdbc:h2:mem:ue6_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.security.jwt.public-key=classpath:keys/public.pem
app.security.jwt.private-key=classpath:keys/private.pem
app.security.jwt.issuer=ue6dejunio-api-test
app.security.jwt.access-token-ttl-minutes=15
app.security.cors.allowed-origins=http://localhost:5173
app.security.bcrypt.strength=4

app.security.rate-limit.enabled=true
app.security.rate-limit.login.capacity=2
app.security.rate-limit.login.refill-per-minute=2
app.security.rate-limit.global.capacity=50
app.security.rate-limit.global.refill-per-minute=50
app.security.rate-limit.change-password.capacity=2
app.security.rate-limit.change-password.refill-per-minute=2
app.security.rate-limit.forgot-password.capacity=2
app.security.rate-limit.forgot-password.refill-per-minute=2
app.security.rate-limit.reset-password.capacity=2
app.security.rate-limit.reset-password.refill-per-minute=2

app.security.jwt.reset-token-ttl-minutes=20
app.frontend.reset-url=http://localhost:5173/reset-password

# No timer fires during a test run. The sweep is driven explicitly where it is under test; left
# armed, it would wake up mid-suite, drain rows another test had just queued, and call a model that
# is not running.
app.risk.sweep.enabled=false
